services:
  node:
    image: midnightntwrk/midnight-node:0.22.3
    container_name: canopy-devnet-node
    ports:
      - "127.0.0.1:9944:9944"
    environment:
      CFG_PRESET: dev
      SIDECHAIN_BLOCK_BENEFICIARY: "04bcf7ad3be7a5c790460be82a713af570f22e0f801f6659ab8e84a52be6969e"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9944/health"]
      interval: 2s
      timeout: 5s
      retries: 10
      start_period: 40s

  indexer:
    image: midnightntwrk/indexer-standalone:4.0.1
    container_name: canopy-devnet-indexer
    ports:
      - "127.0.0.1:8088:8088"
    environment:
      RUST_LOG: "indexer=warn,chain_indexer=warn,indexer_api=warn,wallet_indexer=warn,indexer_common=warn,info"
      APP__INFRA__SECRET: "303132333435363738393031323334353637383930313233343536373839303132"
      APP__INFRA__NODE__URL: "ws://node:9944"
    depends_on:
      node:
        condition: service_started
